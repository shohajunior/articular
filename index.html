<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArticularUZ  National Youth Aerospace Tournament</title>
  <meta name="description" content="National youth aerospace tournament in Uzbekistan. Students research space challenges, design decks, and defend findings in English before Uzcosmos Agency jury.">
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Prevent FOUC Theme Script -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('articular-theme');
        var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)]">
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
